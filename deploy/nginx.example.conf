# nginx site for MediScan. Put at /etc/nginx/sites-available/<domain>, symlink to
# sites-enabled, then `certbot --nginx -d <domain>` adds the TLS + redirect blocks.
#
# Serves:
#   /        -> backend API (FastAPI on 127.0.0.1:8090)
#   /admin/  -> web admin console, built and shipped by every CI deploy into
#              backend/admin_ui (built with VITE_BASE=admin)
server {
    server_name mediscan.example.com;
    client_max_body_size 20M;

    location /admin/ {
        # The copy every deploy refreshes - never a folder copied by hand,
        # which once left production serving the 11 Aug admin for months.
        alias /opt/mediscan/backend/admin_ui/;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 80;
    # certbot will add: listen 443 ssl; ssl_certificate ...; and an HTTP->HTTPS redirect.
}
