# One-click deploy to Render (render.com). Push this repo, then "New > Blueprint".
# Gives the backend a public HTTPS URL — bake that into the mobile APK so it works
# anywhere, not just on home wifi.
services:
  - type: web
    name: mediscan-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong secret
      - key: DATABASE_URL
        fromDatabase:
          name: mediscan-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false                  # set to your web-admin URL after first deploy
      - key: GEMINI_API_KEY
        sync: false                  # paste your rotated key in the dashboard
      - key: OCR_MODEL
        value: gemini-2.5-flash
      - key: ALLOW_MOCK_OCR
        value: "false"
      - key: STORAGE_BACKEND
        value: local

databases:
  - name: mediscan-db
    plan: free
