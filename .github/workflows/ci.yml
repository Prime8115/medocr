name: CI

# Runner, action and runtime versions are pinned deliberately:
#   * ubuntu-24.04 rather than ubuntu-latest - "latest" silently becomes Ubuntu
#     26 on 19 Oct 2026, and a build machine should change when we choose.
#   * Node 22: Node 20 reached end of life in April 2026.
#   * Python 3.12 to match backend/Dockerfile (python:3.12-slim), so CI tests
#     the interpreter production actually runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install deps
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: ./backend
        run: python -m pytest -q

  mobile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install deps
        working-directory: ./mobile
        run: npm ci
      - name: Typecheck
        working-directory: ./mobile
        run: npm run typecheck
      - name: Unit tests
        working-directory: ./mobile
        run: npm test

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install deps
        working-directory: ./web
        run: npm ci
      - name: Build (typechecks)
        working-directory: ./web
        run: npm run build
      - name: Unit tests
        working-directory: ./web
        run: npm test
