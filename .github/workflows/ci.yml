name: CI

# Runner, action and runtime versions are pinned deliberately:
#   * ubuntu-24.04 rather than ubuntu-latest - "latest" silently becomes Ubuntu
#     26 on 19 Oct 2026, and a build machine should change when we choose.
#   * Node 22: Node 20 reached end of life in April 2026.
#   * Python 3.12 to match backend/Dockerfile (python:3.12-slim), so CI tests
#     the interpreter production actually runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-24.04
    # Postgres 16, as production runs, for tests/test_postgres.py: the job
    # queue's claims, leases and partial unique index under real concurrency,
    # and the migrations. SQLite cannot show any of that.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medocr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/medocr_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Tesseract
        # The local OCR fallback (services/ocr/fallback.py) - production has it
        # from the Dockerfile; without it here the photo-OCR tests would skip.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
      - name: Install deps
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Fetch the private invoice corpus
        # Every real invoice we have been sent, with its confirmed values, so
        # no change can break one that already reads right (tests/test_corpus.py).
        # A read-only deploy key on the private repo; never for a fork's PR,
        # which cannot see the secret.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v7
        with:
          repository: Prime8115/medocr-invoices
          ssh-key: ${{ secrets.INVOICE_CORPUS_KEY }}
          path: invoice-corpus
      - name: Run tests
        working-directory: ./backend
        env:
          INVOICE_CORPUS: ${{ github.workspace }}/invoice-corpus
          # On main the corpus must be there: a gate that can be skipped is not one.
          INVOICE_CORPUS_REQUIRED: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        # Each failing test is also reported as an annotation, readable on the
        # run's page without downloading logs.
        run: |
          set -o pipefail
          python -m pytest -q -rf 2>&1 | tee pytest-output.txt || {
            grep -E "^(FAILED|ERROR) " pytest-output.txt | head -40 | sed 's/^/::error::/'
            exit 1
          }

  mobile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install deps
        working-directory: ./mobile
        run: npm ci
      - name: Typecheck
        working-directory: ./mobile
        run: npm run typecheck
      - name: Unit tests
        working-directory: ./mobile
        run: npm test

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install deps
        working-directory: ./web
        run: npm ci
      - name: Build (typechecks)
        working-directory: ./web
        run: npm run build
      - name: Unit tests
        working-directory: ./web
        run: npm test
