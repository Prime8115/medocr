name: ${COMPOSE_PROJECT_NAME:-mediscan}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediscan
      POSTGRES_DB: mediscan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in partner-deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediscan -d mediscan"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: ./.env
    environment:
      ENVIRONMENT: production
      ALLOW_MOCK_OCR: "false"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in partner-deploy/.env}
    volumes:
      - source_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 15s
      timeout: 7s
      start_period: 60s
      retries: 5

  web:
    build:
      context: ../web
      args:
        VITE_API_URL: https://${API_DOMAIN:?Set API_DOMAIN in partner-deploy/.env}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: [standalone]
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in partner-deploy/.env}
      WEB_DOMAIN: ${WEB_DOMAIN:?Set WEB_DOMAIN in partner-deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
  source_storage:
  caddy_data:
  caddy_config:
